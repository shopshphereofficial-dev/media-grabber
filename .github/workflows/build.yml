name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34 (if missing)
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Media-Grabber-v1.3.apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3 Media-Grabber-v1.3.apk \
            --title "Media Grabber v1.3 (turbo downloads + engine auto-update + quality picker)" \
            --notes "aria2c 16-connection fast downloads, yt-dlp engine auto-updates daily (fixes YouTube), SnapTube-style quality picker (1080p/720p/480p/360p, MP3 320k/128k), search bar, 8 site shortcuts, parallel downloads. Personal use only." \
            || gh release upload v1.3 Media-Grabber-v1.3.apk --clobber
